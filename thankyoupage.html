<!DOCTYPE html>

    <script>
      !function(f,b,e,v,n,t,s){
        if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};

        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)
      }(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');

      fbq('init', '862190763626893');
      fbq('init', '1801978390843079');
      fbq('track', 'PageView');

      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var ph = params.get('ph') || '';
          var eventId = ph ? ('lead_' + ph) : ('lead_' + Date.now());
          if (!window.__leadFired) {
            window.__leadFired = true;
            fbq('track', 'Lead', {}, { eventID: eventId });
          }
        } catch (e) {}
      })();

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.4; background: #ffffff;
      }
      .ty-wrap {
        min-height: 100vh; max-width: 28rem; margin: 0 auto;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 28px; padding: 24px 20px;
        background: #ffffff; text-align: center;
      }
      .ty-steps { display: flex; align-items: center; justify-content: center; }
      .ty-circle {
        width: 46px; height: 46px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 22px; flex: 0 0 auto;
      }
      .ty-circle.done { background: #00b430; color: #fff; }
      .ty-circle.todo { background: #fff; color: #111; border: 3px solid #00b430; }
      .ty-line { width: 40px; height: 3px; background: #111; }
      .ty-title {
        font-weight: 900; font-size: 22px; line-height: 1.3;
        text-transform: uppercase; color: #111; max-width: 360px;
      }
      .ty-arrows { display: flex; align-items: flex-end; justify-content: center; gap: 7px; }
      .ty-arrows span { color: #00b430; font-size: 32px; line-height: 1; font-weight: 900; }
      .tg-button {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        width: 100%; max-width: 360px; height: 64px;
        background: #1583ba; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        border: none; cursor: pointer; border-radius: 40px;
        font-weight: 800; font-size: 22px; text-transform: uppercase;
        text-decoration: none; box-shadow: 0 12px 26px rgba(34, 158, 217, 0.45);
      }
      .text-xs { font-size: 0.75rem; line-height: 1.4; }
      .size-12 { width: 3rem; height: 3rem; }
      .shrink-0 { flex-shrink: 0; }
      .flex { display: flex; }
      .items-center { align-items: center; }
      .gap-3 { gap: 0.75rem; }
      .p-3 { padding: 0.75rem; }
      .rounded-2xl { border-radius: 1rem; }
      @keyframes wobble {
        0%, 100% { transform: rotate(0deg); } 20% { transform: rotate(-2.5deg); }
        40% { transform: rotate(2deg); } 60% { transform: rotate(-1.5deg); }
        80% { transform: rotate(1deg); }
      }
      .animate-wobble { animation: wobble 2.2s ease-in-out infinite; }
      @keyframes shakeX-with-pause {
        0%, 33% { transform: translate(0); }
        3.3%, 9.9%, 16.5%, 23.1%, 29.7% { transform: translate(-10px); }
        6.6%, 13.2%, 19.8%, 26.4% { transform: translate(10px); }
        33%, to { transform: translate(0); }
      }
      .animate-shakeX { animation: 3s ease-in-out infinite shakeX-with-pause; }
      .gift-icon { transform-origin: top; animation: 1.6s ease-in-out infinite gift-bell; }
      @keyframes gift-bell {
        0% { transform: rotate(0); } 10% { transform: rotate(14deg); }
        20% { transform: rotate(-12deg); } 30% { transform: rotate(10deg); }
        40% { transform: rotate(-8deg); } 50% { transform: rotate(6deg); }
        60% { transform: rotate(-4deg); } 70% { transform: rotate(2deg); }
        80% { transform: rotate(-1deg); } 90% { transform: rotate(0); } to { transform: rotate(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .animate-wobble, .animate-shakeX, .gift-icon { animation: none; }
      }
    </style>
  </head>

  <body>
    <div class="ty-wrap">
      <div class="ty-steps" aria-hidden="true">

      <a href="https://t.me/stopautizm3" target="_blank" rel="noopener"

        <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">

        <span role="img" aria-label="Sovg'a" class="size-12 shrink-0 gift-icon"
          style="font-size: 42px; line-height: 48px; text-align: center">&#127873;</span>
        <p class="text-xs" style="text-align: left">
          <b>SOVG'A: Bonus &#8212;</b> Uy sharoitida kalsiy tayyorlash darsligi
        </p>
      </div>
    </div>

    <script>
      (function () {
        var btn = document.getElementById('tgBtn');
        var sent = false;
        if (btn) {
          btn.addEventListener('click', function () {
            if (typeof fbq === 'function' && !sent) {
              sent = true;
              fbq('track', 'Contact');

</html>
